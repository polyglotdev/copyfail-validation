# Later-sorting file that DEFEATS the 00-blacklist.conf install rule for
# algif_aead by re-pointing it at /sbin/modprobe. modprobe's "later wins"
# semantics mean this file's install directive shadows the earlier one,
# so the module can still be auto-loaded despite the operator believing
# they had blocked it. The modprobe.dependency_chain check (Phase 5)
# exists precisely to detect this defense-in-depth gap.
install algif_aead /sbin/modprobe --ignore-install algif_aead
