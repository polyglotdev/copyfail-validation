name: test

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }} / go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
        go: ["1.26.x"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - run: go mod download
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: SPDX license header check
        run: |
          MISSING=$(find . -name '*.go' -not -path './vendor/*' \
            -exec sh -c 'head -2 "$1" | grep -q "SPDX-License-Identifier: Apache-2.0" || echo "$1"' _ {} \;)
          if [ -n "$MISSING" ]; then
            echo "Missing SPDX header in:"
            echo "$MISSING"
            exit 1
          fi

  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true
      - uses: golangci/golangci-lint-action@v6
        with:
          # Pin the exact version we use locally so the config schema and
          # the linter rule set are byte-identical between dev and CI.
          #
          # Why pinned (not "latest"):
          #   - "latest" with the default binary install resolved to v1.64.8
          #     (built with Go 1.24, refused our Go-1.26.2 module).
          #   - "latest" with install-mode: goinstall resolved to the latest
          #     v1.x release because v2.x lives at the /v2 import path
          #     (Go semantic-import-versioning rule for v2+).
          # Pinning v2.11.4 sidesteps both issues: it is a v2-schema-aware
          # build compiled with Go 1.26.x, downloaded directly from the
          # GitHub releases page.
          version: v2.11.4

  vuln:
    name: govulncheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
