version: 2

project_name: copyfail-validation

before:
  hooks:
    - go mod tidy

builds:
  - id: copyfail-validate
    main: ./cmd/copyfail-validate
    binary: copyfail-validate
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/polyglotdev/copyfail-validation/internal/buildinfo.Version={{.Version}}
      - -X github.com/polyglotdev/copyfail-validation/internal/buildinfo.Commit={{.ShortCommit}}
      - -X github.com/polyglotdev/copyfail-validation/internal/buildinfo.BuildDate={{.Date}}
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: copyfail-validate
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - SECURITY.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^chore:"
      - "^test:"
      - "^ci:"

release:
  draft: false
  prerelease: auto
